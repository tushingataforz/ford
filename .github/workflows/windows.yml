- name: Configurar Senha e Sessão do VNC
      run: |
        mkdir -p ~/.vnc
        # Gera o arquivo de senha do VNC usando pipe seguro
        printf "P@ssw0rd\nP@ssw0rd\n\n" | vncpasswd
        chmod 600 ~/.vnc/passwd

        # Configura o script xstartup para carregar o XFCE
        cat << 'EOF' > ~/.vnc/xstartup
        #!/bin/bash
        xrdb $HOME/.Xresources
        startxfce4 &
        EOF
        chmod +x ~/.vnc/xstartup

    - name: Iniciar Servidor VNC
      run: |
        vncserver :1 -geometry 1280x720 -depth 24
        echo "Servidor VNC rodando na porta 5901!"
