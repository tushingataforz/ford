name: EnigMano Docker Firefox with Tailscale

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-firefox-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      run: |
        echo -e "\e[32m=== ENIGMANO DOCKER DEPLOYMENT ===\e[0m"
        echo -e "\e[33mInstance Number: ${{ github.event.inputs.instance_number }}\e[0m"
        echo -e "\e[33mRunner: $RUNNER_NAME\e[0m"
        echo -e "\e[36mCPU Cores: $(nproc)\e[0m"
        echo -e "\e[36mMemory: $(free -h | awk '/^Mem:/ {print $2}')\e[0m"

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci

    - name: Get Tailscale IP
      run: |
        TS_IP=$(tailscale ip -4)
        echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
        echo -e "\e[32mTailscale IP: $TS_IP\e[0m"

    - name: Run Firefox Docker Container
      run: |
        echo -e "\e[32mStarting Firefox Container...\e[0m"
        docker run -d \
          --name=firefox-gui \
          -e PUID=1000 \
          -e PGID=1000 \
          -e TZ=America/Sao_Paulo \
          -p 3000:3000 \
          --shm-size=2gb \
          --restart unless-stopped \
          lscr.io/linuxserver/firefox:latest
          
        sleep 5
        echo -e "\e[32mFirefox container started successfully!\e[0m"

    - name: Connection Details
      run: |
        echo -e "\e[32m\n=== CONNECTION DETAILS (TAILSCALE) ===\e[0m"
        echo -e "\e[36m╔══════════════════════════════════════════════════╗\e[0m"
        echo -e "\e[36m║             ENIGMANO FIREFOX DOCKER              ║\e[0m"
        echo -e "\e[36m╠══════════════════════════════════════════════════╣\e[0m"
        echo -e "\e[37m║ URL: http://$TAILSCALE_IP:3000                  ║\e[0m"
        echo -e "\e[36m╚══════════════════════════════════════════════════╝\e[0m"
        
        echo -e "\e[33m\nInstruções de Acesso:\e[0m"
        echo -e "\e[37m1. Conecte no seu Tailscale pelo celular, PC ou tablet\e[0m"
        echo -e "\e[37m2. Abra o navegador e acesse: http://$TAILSCALE_IP:3000\e[0m"

    - name: Keep Session Alive
      run: |
        echo -e "\e[32m\n=== SESSION ACTIVE ===\e[0m"
        echo -e "\e[36mO Firefox Docker está rodando!\e[0m"
        
        counter=0
        while true; do
          counter=$((counter+1))
          echo "Heartbeat #$counter ($(date))"
          sleep 60
        done
