name: EnigMano Windows 10 Docker RDP

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-win10-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Connect to Tailscale
      run: |
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="enigmano-win10-${{ github.run_id }}"

    - name: Get Tailscale IP
      run: |
        TS_IP=$(tailscale ip -4)
        echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

    - name: Run Windows 10 Container
      run: |
        echo "Iniciando Windows 10 no Docker..."
        docker run -d \
          --name win10 \
          --net=host \
          --cap-add=NET_ADMIN \
          -e VERSION="win10" \
          -e RAM_SIZE="4G" \
          -e CPU_CORES="2" \
          -e DISK_SIZE="25G" \
          -e USERNAME="runneradmin" \
          -e PASSWORD="admin" \
          --shm-size=2gb \
          --restart unless-stopped \
          dockurr/windows

        echo "Aguardando inicialização do sistema..."
        sleep 60

    - name: Connection Details
      run: |
        echo -e "\e[32m\n=== CONECTE NO WINDOWS APP ===\e[0m"
        echo "Host: $TAILSCALE_IP"
        echo "Usuário: runneradmin"
        echo "Senha: admin"

    - name: Keep Session Alive
      run: |
        counter=0
        while true; do
          counter=$((counter+1))
          echo "Heartbeat #$counter ($(date))"
          sleep 60
        done
