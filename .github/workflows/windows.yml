name: EnigMano Fast XFCE RDP (Ultra Light)

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-xfce-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Connect to Tailscale
      run: |
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="enigmano-xfce-${{ github.run_id }}"

    - name: Get Tailscale IP
      run: |
        TS_IP=$(tailscale ip -4)
        echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

    - name: Setup Optimized Debian XFCE4
      run: |
        docker run -d \
          --name=debian-xfce \
          --net=host \
          --privileged \
          --shm-size=4gb \
          debian:bookworm-slim sleep infinity

        # Instalação minimalista de pacotes sem extras pesados
        docker exec debian-xfce apt-get update
        docker exec debian-xfce apt-get install -y --no-install-recommends \
          xfce4 xfwm4 xfce4-terminal xrdp firefox-esr sudo dbus-x11

        # Criação do usuário
        docker exec debian-xfce useradd -m -s /bin/bash runneradmin
        docker exec debian-xfce bash -c "echo 'runneradmin:admin' | chpasswd"
        docker exec debian-xfce usermod -aG sudo runneradmin

        # Desativa efeitos visuais/sombras para tirar o lag
        docker exec debian-xfce mkdir -p /home/runneradmin/.config/xfce4/xfconf/xfce-perchannel-xml
        docker exec debian-xfce bash -c "cat << 'EOF' > /home/runneradmin/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
        <?xml version=\"1.0\" encoding=\"UTF-8\"?>
        <channel name=\"xfwm4\" version=\"1.0\">
          <property name=\"general\" type=\"empty\">
            <property name=\"use_compositing\" type=\"bool\" value=\"false\"/>
          </property>
        </channel>
        EOF"

        # Configura sessão XFCE
        docker exec debian-xfce bash -c "echo 'startxfce4' > /home/runneradmin/.xsession"

        # Otimiza o XRDP para foco em performance e menor latência
        docker exec debian-xfce sed -i 's/max_bpp=32/max_bpp=16/g' /etc/xrdp/xrdp.ini
        docker exec debian-xfce sed -i 's/crypt_level=high/crypt_level=low/g' /etc/xrdp/xrdp.ini

        # Permissões do usuário
        docker exec debian-xfce chown -R runneradmin:runneradmin /home/runneradmin

        # Inicia o serviço RDP
        docker exec debian-xfce service xrdp start

    - name: Connection Details
      run: |
        echo -e "\e[32m\n=== CONECTE NO WINDOWS APP ===\e[0m"
        echo "IP / Host: $TAILSCALE_IP"
        echo "Usuário: runneradmin"
        echo "Senha: admin"

    - name: Keep Session Alive
      run: |
        counter=0
        while true; do
          counter=$((counter+1))
          echo "Heartbeat #$counter ($(date))"
          sleep 60
        done
