name: EnigMano Debian XFCE4 RDP

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-xfce-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Connect to Tailscale
      run: |
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="enigmano-xfce-${{ github.run_id }}"

    - name: Get Tailscale IP
      run: |
        TS_IP=$(tailscale ip -4)
        echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

    - name: Setup Debian XFCE4 Container
      run: |
        docker run -d \
          --name=debian-xfce \
          --net=host \
          --privileged \
          --shm-size=2gb \
          debian:bookworm-slim sleep infinity

        # Instala pacotes basicos necessarios
        docker exec debian-xfce apt-get update
        docker exec debian-xfce apt-get install -y xfce4 xfce4-goodies xrdp firefox-esr sudo dbus-x11

        # Cria usuario runneradmin
        docker exec debian-xfce useradd -m -s /bin/bash runneradmin
        docker exec debian-xfce bash -c "echo 'runneradmin:admin' | chpasswd"
        docker exec debian-xfce usermod -aG sudo runneradmin

        # Define startxfce4 corretamente no xsession do usuario e no global
        docker exec debian-xfce bash -c "echo 'startxfce4' > /home/runneradmin/.xsession"
        docker exec debian-xfce bash -c "echo 'startxfce4' > /etc/skel/.xsession"
        docker exec debian-xfce chown runneradmin:runneradmin /home/runneradmin/.xsession

        # Inicia o servico RDP
        docker exec debian-xfce service xrdp start

    - name: Connection Details
      run: |
        echo -e "\e[32m\n=== CONECTE NO WINDOWS APP COM ESSES DADOS ===\e[0m"
        echo "IP / Host: $TAILSCALE_IP"
        echo "Usuário: runneradmin"
        echo "Senha: admin"

    - name: Keep Session Alive
      run: |
        counter=0
        while true; do
          counter=$((counter+1))
          echo "Heartbeat #$counter ($(date))"
          sleep 60
        done
