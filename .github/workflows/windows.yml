name: EnigMano Ubuntu Docker RDP (Firefox)

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-ubuntu-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      run: |
        echo -e "\e[32m=== ENIGMANO UBUNTU RDP DEPLOYMENT ===\e[0m"
        echo -e "\e[33mInstance Number: ${{ github.event.inputs.instance_number }}\e[0m"
        echo -e "\e[33mRunner: $RUNNER_NAME\e[0m"
        echo -e "\e[36mCPU Cores: $(nproc)\e[0m"
        echo -e "\e[36mMemory: $(free -h | awk '/^Mem:/ {print $2}')\e[0m"

    - name: Install Tailscale
      run: |
        echo -e "\e[32mInstalling Tailscale...\e[0m"
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Connect to Tailscale
      run: |
        echo -e "\e[32mConnecting to Tailscale...\e[0m"
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="enigmano-ubuntu-${{ github.run_id }}"

    - name: Get Tailscale IP
      run: |
        TS_IP=$(tailscale ip -4)
        echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
        echo -e "\e[32mTailscale IP: $TS_IP\e[0m"

    - name: Run Remote Desktop Container
      run: |
        echo -e "\e[32mStarting RDP Container with Firefox...\e[0m"
        docker run -d \
          --name=ubuntu-rdp \
          -e USER_USERNAME=runneradmin \
          -e USER_PASSWORD=P@ssw0rd! \
          -p 3389:3389 \
          --shm-size=2gb \
          --restart unless-stopped \
          scottyhardy/docker-remote-desktop

        sleep 10
        echo -e "\e[32mSetup completed successfully!\e[0m"

    - name: Connection Details
      run: |
        echo -e "\e[32m\n=== CONNECTION DETAILS (WINDOWS APP / RDP) ===\e[0m"
        echo -e "\e[36m╔══════════════════════════════════════════════════╗\e[0m"
        echo -e "\e[36m║             ENIGMANO UBUNTU RDP                  ║\e[0m"
        echo -e "\e[36m╠══════════════════════════════════════════════════╣\e[0m"
        echo -e "\e[37m║ Host: $TAILSCALE_IP                              ║\e[0m"
        echo -e "\e[37m║ Username: runneradmin                            ║\e[0m"
        echo -e "\e[37m║ Password: P@ssw0rd!                              ║\e[0m"
        echo -e "\e[36m╚══════════════════════════════════════════════════╝\e[0m"

    - name: Keep Session Alive
      run: |
        echo -e "\e[32m\n=== SESSION ACTIVE ===\e[0m"
        counter=0
        while true; do
          counter=$((counter+1))
          echo "Heartbeat #$counter ($(date))"
          sleep 60
        done
